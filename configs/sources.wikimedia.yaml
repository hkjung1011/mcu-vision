schema_version: 1
api_url: https://commons.wikimedia.org/w/api.php
user_agent: mcu-vision-dataset/0.2 (+https://github.com/hkjung1011/mcu-vision/issues)
allowed_license_prefixes:
  - CC0
  - CC BY
  - CC-BY
  - Public domain
  - PD
download:
  max_dimension_px: 2048
  min_width_px: 320
  min_height_px: 240
  max_file_bytes: 31457280
  max_decoded_pixels: 25000000
  max_decoded_dimension_px: 8192
  max_frames: 1
  request_delay_seconds: 0.15
  timeout_seconds: 30
discovery:
  candidate_multiplier: 3
  minimum_candidates_per_route: 100
  max_search_results_per_query: 750
  max_category_files_per_class: 2000

classes:
  raspberry_pi_sbc:
    category_depth: 2
    categories:
      - Category:Raspberry Pi
    search_queries:
      - incategory:"Raspberry Pi" Raspberry Pi board
      - Raspberry Pi 5 board
      - Raspberry Pi 4 Model B
      - Raspberry Pi Zero board
    include_any:
      - raspberry pi
      - raspberry-pi
      - rpi
    exclude_any:
      - logo
      - schematic
      - diagram
      - case only
      - pico
      - rp2040

  raspberry_pi_pico:
    category_depth: 2
    categories:
      - Category:Raspberry Pi Pico
    search_queries:
      - Raspberry Pi Pico board
      - RP2040 development board
    include_any:
      - pico
      - rp2040
      - rp2350
    exclude_any:
      - logo
      - schematic
      - diagram

  stm32_dev_board:
    category_depth: 2
    categories:
      - Category:STM32
    search_queries:
      - STM32 Nucleo board
      - STM32 Discovery board
      - STM32 development board
    include_any:
      - nucleo
      - discovery
      - stm32 development
      - stm32 board
      - blue pill
      - black pill
    exclude_any:
      - logo
      - schematic
      - diagram

  stm32_bare_ic:
    category_depth: 1
    categories:
      - Category:STM32
    search_queries:
      - STM32 microcontroller package
      - STM32 integrated circuit
    include_any:
      - stm32
    exclude_any:
      - nucleo
      - discovery
      - development board
      - board
      - maple
      - evaluation board
      - embedded world
      - microstm32
      - die photo
      - die image
      - microscopy
      - micrograph
      - sram
      - sem-hd
      - "-hd"
      - logo
      - schematic
      - diagram
