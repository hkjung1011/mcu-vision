[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcu-data-tools"
version = "0.1.0"
description = "Licensed image collection and dataset auditing tools for MCU vision experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
  "requests>=2.32,<3",
  "Pillow>=11,<13",
  "ImageHash>=4.3,<5",
  "PyYAML>=6,<7",
  "tqdm>=4.67,<5",
  "kagglehub>=1,<2",
  "matplotlib>=3.10,<4",
  "tensorboard>=2.18,<3",
  "pycocotools>=2.0.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
mcu-collect-commons = "mcu_data.wikimedia:main"
mcu-download-curated = "mcu_data.curated:main"
mcu-audit = "mcu_data.audit:main"
mcu-prepare-micropcb = "mcu_data.micropcb:main"
mcu-split-condition-groups = "mcu_data.condition_split:main"
mcu-show-status = "mcu_data.reporting:status_main"
mcu-evaluate-predictions = "mcu_data.reporting:evaluate_main"
mcu-compare-runs = "mcu_data.reporting:compare_main"
mcu-show-weights = "mcu_data.reporting:weights_main"
mcu-show-protocol = "mcu_data.methodology:main"
mcu-autolabel-yolo = "mcu_data.autolabel:main"
mcu-verify-dataset-equivalence = "mcu_data.dataset_evidence:main"
mcu-publish-progress = "mcu_data.progress_publishing:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
